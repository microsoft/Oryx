# Validates SHA hashes against official upstream sources.
# PR comments are posted by validate-sha-comment.yaml so that forked PRs are
# also covered (workflow_run runs in the base-repo context with write access).
name: Validate SHA Hashes

on:
  pull_request:
    branches: [main]
    paths:
      - 'platforms/**/versionsToBuild.txt'
      - 'images/constants.yml'
      - 'build/scripts/validate-*-sha.sh'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed stacks
        id: changes
        run: |
          BASE_REF="${{ github.base_ref }}"
          BASE_REF="${BASE_REF:-main}"
          git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true
          CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD || git diff --name-only HEAD~1)
          echo "php=$(echo "$CHANGED" | grep -qE '^(platforms/php/|images/constants.yml)' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "dotnet=$(echo "$CHANGED" | grep -qE '^(platforms/dotnet/|images/constants.yml)' && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Validate PHP SHA256
        id: php
        if: steps.changes.outputs.php == 'true'
        continue-on-error: true
        run: |
          output=$(./build/scripts/validate-php-sha.sh images/constants.yml 2>&1) || true
          echo "$output"
          echo 'output<<EOF' >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
          echo "$output" | grep -q "SHA VALIDATION PASSED" && exit 0 || exit 1

      - name: Validate .NET SHA512
        id: dotnet
        if: steps.changes.outputs.dotnet == 'true'
        continue-on-error: true
        run: |
          output=$(./build/scripts/validate-dotnet-sha.sh images/constants.yml 2>&1) || true
          echo "$output"
          echo 'output<<EOF' >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
          echo "$output" | grep -q "SHA VALIDATION PASSED" && exit 0 || exit 1

      - name: Save results and write summary
        if: always() && (steps.changes.outputs.php == 'true' || steps.changes.outputs.dotnet == 'true')
        uses: actions/github-script@v7
        env:
          PHP_OUTPUT: ${{ steps.php.outputs.output }}
          DOTNET_OUTPUT: ${{ steps.dotnet.outputs.output }}
        with:
          script: |
            const fs = require('fs');
            const php = '${{ steps.changes.outputs.php }}' === 'true';
            const dotnet = '${{ steps.changes.outputs.dotnet }}' === 'true';
            const phpStatus = '${{ steps.php.outcome }}';
            const dotnetStatus = '${{ steps.dotnet.outcome }}';
            const phpOutput = process.env.PHP_OUTPUT || '';
            const dotnetOutput = process.env.DOTNET_OUTPUT || '';
            const icon = s => s === 'success' ? '✅' : s === 'skipped' ? '⏭️' : '❌';

            let body = '## SHA Validation Summary\n| Stack | Status |\n|-------|--------|\n';
            if (php) body += `| PHP | ${icon(phpStatus)} ${phpStatus} |\n`;
            if (dotnet) body += `| .NET | ${icon(dotnetStatus)} ${dotnetStatus} |\n`;
            if (php && phpOutput) {
              body += `\n<details><summary>PHP Validation Output</summary>\n\n\`\`\`\n${phpOutput}\n\`\`\`\n</details>\n`;
            }
            if (dotnet && dotnetOutput) {
              body += `\n<details><summary>.NET Validation Output</summary>\n\n\`\`\`\n${dotnetOutput}\n\`\`\`\n</details>\n`;
            }

            // Write job summary (visible in the Actions UI for all run types)
            await core.summary.addRaw(body, true).write();

            // Persist results so validate-sha-comment.yaml can post a PR comment
            // with base-repo token permissions (works for forked PRs too).
            const results = {
              php, dotnet, phpStatus, dotnetStatus,
              phpOutput, dotnetOutput,
              pr_number: context.payload.pull_request?.number ?? null,
              summary_body: body
            };
            fs.mkdirSync('/tmp/validation-results', { recursive: true });
            fs.writeFileSync('/tmp/validation-results/results.json', JSON.stringify(results));

      - name: Upload validation results
        if: always() && (steps.changes.outputs.php == 'true' || steps.changes.outputs.dotnet == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: sha-validation-results
          path: /tmp/validation-results/results.json
          retention-days: 1

      - name: Fail if SHA validation failed
        if: always()
        run: |
          PHP_OUTCOME="${{ steps.php.outcome }}"
          DOTNET_OUTCOME="${{ steps.dotnet.outcome }}"
          if [[ "$PHP_OUTCOME" == "failure" || "$DOTNET_OUTCOME" == "failure" ]]; then
            echo "::error::SHA validation failed"
            exit 1
          fi
