# Posts the SHA validation summary as a PR comment.
# Triggered after validate-sha.yaml completes so that it runs in the
# base-repo context and has pull-requests: write permission even when the
# originating PR comes from a fork.
name: Post SHA Validation Comment

on:
  workflow_run:
    workflows: ["Validate SHA Hashes"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    # Only comment when the triggering event was a pull_request
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download validation results
        uses: actions/download-artifact@v4
        with:
          name: sha-validation-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # Artifact is only uploaded when at least one stack changed.
        # If nothing changed the artifact won't exist; skip gracefully.
        continue-on-error: true

      - name: Post PR comment
        # hashFiles returns an empty string when the file is absent
        if: hashFiles('results.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results;
            try {
              results = JSON.parse(fs.readFileSync('results.json', 'utf8'));
            } catch (e) {
              core.info('Could not parse validation results; skipping comment.');
              return;
            }

            const { pr_number, summary_body } = results;
            if (!pr_number || !summary_body) {
              core.info('Missing PR number or summary body; skipping comment.');
              return;
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body: summary_body
              });
              core.info(`Posted SHA validation comment to PR #${pr_number}`);
            } catch (error) {
              core.warning(`Unable to post SHA validation comment: ${error.message}`);
            }
